<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>TESTIFAI</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0a1a3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TESTIFAI">
<link rel="apple-touch-icon" href="./icon.png">
<link rel="icon" type="image/png" href="./icon.png">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    /* Red, white & blue. --gold kept as the var name but is now the primary red. */
    --bg: #0a1a3a; --panel: #11244a; --panel2: #172c57; --line: #2a3f6b;
    --fg: #f5f8ff; --muted: #9fb2d6;
    --gold: #e02a3c; --gold-dim: #b21f2e;   /* primary red */
    --blue: #4f83e8; --red: #e02a3c; --white: #ffffff;
    --ok: #7cf3a0; --bad: #ff6b6b; --radius: 14px;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5; overscroll-behavior-y: none;
  }
  #app {
    max-width: 620px; margin: 0 auto; min-height: 100%;
    padding: calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 96px);
    display: flex; flex-direction: column;
  }

  /* header */
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .logo { width: 36px; height: 36px; border-radius: 9px; display: block; object-fit: cover; }
  .brand { font-weight: 800; letter-spacing: 1px; font-size: 20px; }
  .brand span { color: var(--blue); }
  .brand-icon { display: block; margin: 6px auto 14px; width: 96px; height: 96px;
    border-radius: 22px; object-fit: cover; box-shadow: 0 10px 34px rgba(0,0,0,.55); }
  .tag { color: var(--muted); font-size: 12.5px; margin: 2px 0 16px; }
  .credit { color: var(--muted); font-size: 11px; text-align: center; margin: 26px 0 4px; opacity: .85; line-height: 1.5; }

  /* progress */
  .steps { display: flex; gap: 6px; margin-bottom: 18px; }
  .steps .dot { flex: 1; height: 4px; border-radius: 3px; background: var(--line); }
  .steps .dot.on { background: var(--red); }
  .steps .dot.done { background: var(--blue); }

  h2 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 13.5px; margin-bottom: 16px; }

  label { display: block; font-size: 12.5px; color: var(--muted); margin: 12px 0 5px; text-transform: uppercase; letter-spacing: .04em; }
  input, select, textarea {
    width: 100%; background: var(--panel); color: var(--fg); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 13px 14px; font-size: 16px; font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }

  /* buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 15px; border-radius: var(--radius); border: 1px solid var(--gold);
    background: var(--gold); color: #fff; font-weight: 700; font-size: 16px; cursor: pointer;
  }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
  .btn.ghost:hover { border-color: var(--gold); }

  /* sticky footer nav */
  .nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: linear-gradient(to top, var(--bg) 70%, transparent);
    padding: 12px 18px calc(env(safe-area-inset-bottom) + 12px);
  }
  .nav-inner { max-width: 620px; margin: 0 auto; display: flex; gap: 10px; }
  .nav-inner .btn { flex: 1; }
  .nav-inner .btn.back { flex: 0 0 88px; }

  /* selectable cards */
  .list { display: flex; flex-direction: column; gap: 9px; margin-top: 6px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 13px 14px; cursor: pointer; display: flex; align-items: center; gap: 12px;
  }
  .card:hover { border-color: var(--blue); }
  .card.sel { border-color: var(--blue); background: rgba(79,131,232,.15); }
  .card .avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; background: var(--panel2);
    flex: 0 0 42px; display: grid; place-items: center; color: var(--muted); font-size: 15px; font-weight: 700; }
  .card .meta { min-width: 0; }
  .card .name { font-weight: 650; font-size: 15px; }
  .card .desc { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .pill { margin-left: auto; font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 20px; padding: 2px 9px; white-space: nowrap; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 6px; }
  .grid .card { display: block; }

  /* slider */
  .slider-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 16px; text-align: center; margin-top: 8px; }
  .slider-val { font-size: 40px; font-weight: 800; color: var(--gold); }
  .slider-val small { font-size: 15px; color: var(--muted); font-weight: 500; }
  input[type=range] { -webkit-appearance: none; appearance: none; height: 6px; border-radius: 6px; background: var(--line); margin: 20px 0 6px; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%; background: var(--gold); border: 3px solid #1a1a1a; }
  input[type=range]::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: var(--gold); border: 3px solid #1a1a1a; }
  .range-legend { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }

  /* result */
  .script { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px; white-space: pre-wrap; font-size: 16px; line-height: 1.7; margin-top: 10px; }
  .result-title { font-weight: 700; font-size: 15px; color: var(--gold); margin-top: 8px; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
  .badge { font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 5px 11px; }
  .badge b { color: var(--fg); }
  .badge.ok b { color: var(--ok); }
  .badge.tap { cursor: pointer; }

  textarea.script { min-height: 240px; resize: vertical; line-height: 1.7; }
  .edit-hint { color: var(--muted); font-size: 12px; margin: 8px 2px 0; }

  /* history rows */
  .hist { display: flex; flex-direction: column; gap: 9px; margin-top: 6px; }
  .hist .row2 { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
  .hist .row2 .meta { min-width: 0; flex: 1; cursor: pointer; }
  .hist .row2 .name { font-weight: 650; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hist .row2 .desc { color: var(--muted); font-size: 12px; }
  .hist .row2 .del { color: var(--muted); font-size: 20px; cursor: pointer; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; }
  .link { color: var(--blue); font-size: 13px; cursor: pointer; text-decoration: underline; }

  .msg { border-radius: var(--radius); padding: 12px 14px; font-size: 13.5px; margin-top: 12px; }
  .msg.err { background: #2a1414; border: 1px solid #5a2a2a; color: #ffb3b3; }
  .msg.info { background: var(--panel); border: 1px solid var(--line); color: var(--muted); }

  .spinner { width: 22px; height: 22px; border: 3px solid rgba(0,0,0,.25); border-top-color: #111; border-radius: 50%; animation: spin .8s linear infinite; }
  .btn.ghost .spinner { border: 3px solid rgba(255,255,255,.2); border-top-color: var(--gold); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .center { display: grid; place-items: center; gap: 14px; padding: 40px 0; text-align: center; color: var(--muted); }

  .hidden { display: none !important; }
  .muted { color: var(--muted); font-size: 12.5px; }
  .search { margin-top: 8px; }
  .count { color: var(--muted); font-size: 12px; margin: 10px 0 2px; }

  /* iOS add-to-home-screen hint */
  .a2hs { position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 88px);
    z-index: 15; background: var(--panel2); border: 1px solid var(--gold); border-radius: var(--radius);
    padding: 11px 14px; font-size: 13px; display: flex; gap: 10px; align-items: center;
    box-shadow: 0 6px 24px rgba(0,0,0,.5); }
  .a2hs .x { margin-left: auto; color: var(--muted); font-size: 20px; cursor: pointer; padding: 0 4px; }
  .a2hs b { color: var(--gold); }

  /* in-app teleprompter (stays inside the installed app / PWA scope) */
  .tp { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column;
    background: var(--tp-bg, #000); }
  .tp.hidden { display: none; }
  .tp-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; scroll-behavior: auto; }
  .tp-inner { padding: 46vh 8vw calc(46vh + env(safe-area-inset-bottom));
    font-size: var(--tp-size, 40px); line-height: 1.55; font-weight: 650;
    color: var(--tp-fg, #fff); text-align: center; }
  .tp-inner .sent { transition: background .15s; padding: 0 2px; border-radius: 6px; }
  .tp-inner .sent.active { background: rgba(79,131,232,.42); }
  .tp-title { font-size: .5em; color: var(--gold); margin-bottom: .8em; font-weight: 700; }
  .tp-guide { position: absolute; top: 50%; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity: .3; pointer-events: none; }
  .tp-bar { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(18,18,18,.96);
    backdrop-filter: blur(8px); border-top: 1px solid var(--line);
    padding: 10px 12px calc(env(safe-area-inset-bottom) + 10px);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .tp-bar.hidden { display: none; }
  .tp-bar button { background: #2a2a2a; color: #eee; border: 1px solid #3a3a3a; border-radius: 9px;
    padding: 9px 13px; font-size: 13px; font-weight: 650; cursor: pointer; }
  .tp-bar button.on { background: var(--gold); color: #fff; border-color: var(--gold); }
  .tp-bar .grp { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  .tp-bar input[type=range] { width: 84px; accent-color: var(--gold); }
  .tp-bar select { background: #2a2a2a; color: #eee; border: 1px solid #3a3a3a; border-radius: 8px;
    padding: 7px 8px; font-size: 12.5px; max-width: 130px; }
  .tp-bar .sw { width: 22px; height: 22px; border-radius: 6px; border: 2px solid #444; cursor: pointer; padding: 0; }
  .tp-hint { position: absolute; top: calc(env(safe-area-inset-top) + 10px); left: 0; right: 0;
    text-align: center; color: rgba(255,255,255,.35); font-size: 12px; pointer-events: none; }
</style>
</head>
<body>
<div id="app">
  <header>
    <img class="logo" id="brandIcon" alt="TESTIFAI">
    <div class="brand">TESTIF<span>AI</span></div>
  </header>
  <div class="tag" id="tagline">Speak up to your lawmakers about AI.</div>
  <div class="steps" id="steps"></div>
  <div id="screen"></div>
</div>

<div class="nav" id="nav">
  <div class="nav-inner" id="navInner"></div>
</div>

<!-- in-app teleprompter overlay (kept inside the app so the iPhone PWA stays standalone) -->
<div class="tp hidden" id="tp">
  <div class="tp-scroll" id="tpScroll"><div class="tp-inner" id="tpInner"></div></div>
  <div class="tp-guide"></div>
  <div class="tp-hint">Tap the script to hide controls</div>
  <div class="tp-bar" id="tpBar">
    <button id="tpPlay">▶ Scroll</button>
    <button id="tpRead">🔊 Read</button>
    <div class="grp">Speed<input type="range" id="tpSpeed" min="10" max="200" value="55"></div>
    <div class="grp">Size<input type="range" id="tpSize" min="24" max="80" value="40"></div>
    <div class="grp">BG
      <button class="sw" style="background:#000" data-bg="#000000"></button>
      <button class="sw" style="background:#0b3d2e" data-bg="#0b3d2e"></button>
      <button class="sw" style="background:#101828" data-bg="#101828"></button>
      <button class="sw" style="background:#fff" data-bg="#ffffff"></button>
    </div>
    <div class="grp">Text
      <button class="sw" style="background:#fff" data-fg="#ffffff"></button>
      <button class="sw" style="background:#c9a84c" data-fg="#c9a84c"></button>
      <button class="sw" style="background:#7cf3a0" data-fg="#7cf3a0"></button>
      <button class="sw" style="background:#000" data-fg="#000000"></button>
    </div>
    <div class="grp" id="tpVoiceGrp">Voice<select id="tpVoice"></select></div>
    <div class="grp">Rate<input type="range" id="tpRate" min="0.5" max="1.5" step="0.05" value="1"></div>
    <button id="tpClose">Done</button>
  </div>
</div>

<script>window.TESTIFAI_CONFIG = { static: true };</script>
<script>
(function () {
  "use strict";
  // Same-origin by default. If you host this page on a static CDN, set
  // window.TESTIFAI_API_BASE = "https://your-api-host" before this script runs.
  var API = (window.TESTIFAI_API_BASE || "").replace(/\/$/, "");
  var TOTAL_STEPS = 6;

  var state = {
    step: 0,
    ref: { states: [], applications: [], goals: [] },
    user: { name: "", gender: "", age: "", state: "" },
    socials: { youtube: "", facebook: "", instagram: "", linkedin: "" },
    targetState: "",
    chamber: "all",
    legislators: [],
    legislator: null,
    application: null,
    goal: null,
    minutes: 2,
    result: null,
    fromHistory: false,
    loadingLegs: false,
    legError: "",
    generating: false,
    genError: "",
    appSearch: "",
  };

  var screen = document.getElementById("screen");
  var navInner = document.getElementById("navInner");
  var stepsEl = document.getElementById("steps");

  function el(html) { var d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }); }
  async function api(path, opts) {
    var r = await fetch(API + path, opts);
    if (!r.ok) { var t = await r.text().catch(function(){return "";}); throw new Error("(" + r.status + ") " + t.slice(0, 300)); }
    return r.json();
  }

  // ── Distribution (static / bring-your-own-key) mode ──────────────────────────
  // When served as a static site (Netlify etc.), there is no backend: the user
  // supplies their own Anthropic key, and the browser calls Claude directly.
  var CFG = window.TESTIFAI_CONFIG || {};
  var STATIC = !!CFG.static;
  var ICON = CFG.icon || (STATIC ? "./icon.png" : "./icon.png");
  function brandIconTag() { return '<img class="brand-icon" src="' + ICON + '" alt="TESTIFAI">'; }
  function creditTag() { return '<div class="credit">Created and developed by Trevor Lawrence Jr. for TREVBEATS MULTIMEDIA LLC</div>'; }
  var MODEL = CFG.model || "claude-sonnet-5";
  // Gemini: "-latest" aliases track Google's newest models so we never pin a
  // retired id; the discovery call below picks the newest available at runtime.
  var GEMINI_FALLBACKS = ["gemini-flash-latest", "gemini-3-flash-preview", "gemini-2.5-flash"];
  var WPM = 140;
  var KKEY = "testifai_anthropic_key";
  function getKey() { try { return localStorage.getItem(KKEY) || ""; } catch (e) { return ""; } }
  function setKey(k) { try { localStorage.setItem(KKEY, k); } catch (e) {} }
  function clearKey() { try { localStorage.removeItem(KKEY); } catch (e) {} }
  function loadJSON(p) { return fetch(p).then(function (r) { if (!r.ok) throw new Error("Could not load " + p); return r.json(); }); }

  async function loadRefData() {
    if (STATIC) {
      var r = await Promise.all([loadJSON("./data/us_states.json"), loadJSON("./data/ai_applications.json"),
        loadJSON("./data/advocacy_goals.json"), loadJSON("./data/ai_blacklist.json")]);
      state.ref.states = r[0]; state.ref.applications = r[1]; state.ref.goals = r[2];
      state.ref.blacklist = (r[3] && r[3].terms) || [];
    } else {
      var res = await Promise.all([api("/advocacy/states"), api("/advocacy/applications"), api("/advocacy/goals")]);
      state.ref.states = res[0]; state.ref.applications = res[1]; state.ref.goals = res[2];
    }
  }

  // Client-side legislators (U.S. Senators + Representatives from the key-free dataset).
  var _congressCache = null;
  var PARTY = { "Democrat": "Democrat", "Republican": "Republican", "Independent": "Independent", "D": "Democrat", "R": "Republican", "I": "Independent" };
  var CONGRESS_SOURCES = [
    "https://unitedstates.github.io/congress-legislators/legislators-current.json",
    "https://raw.githubusercontent.com/unitedstates/congress-legislators/main/legislators-current.json"
  ];
  async function clientLegislators(stateAbbr, chamber) {
    if (!_congressCache) {
      var raw = null, lastErr = null;
      for (var si = 0; si < CONGRESS_SOURCES.length; si++) {
        try { raw = await loadJSON(CONGRESS_SOURCES[si]); break; }
        catch (e) { lastErr = e; }
      }
      if (!raw) throw (lastErr || new Error("Could not load legislator data"));
      var byState = {};
      raw.forEach(function (p) {
        var terms = p.terms || []; if (!terms.length) return;
        var t = terms[terms.length - 1]; var st = t.state; if (!st) return;
        var bio = (p.id || {}).bioguide || "";
        var nm = (p.name || {}).official_full || [((p.name || {}).first), ((p.name || {}).last)].filter(Boolean).join(" ");
        var isSen = t.type === "sen";
        (byState[st] = byState[st] || []).push({
          id: bio || nm, name: nm, role: isSen ? "U.S. Senator" : "U.S. Representative",
          level: "federal", chamber: isSen ? "senate" : "house", party: PARTY[t.party] || t.party || "Unknown",
          state: st, district: isSen ? null : (t.district != null ? String(t.district) : null),
          photo_url: bio ? "https://theunitedstates.io/images/congress/225x275/" + bio + ".jpg" : null,
        });
      });
      _congressCache = byState;
    }
    var arr = (_congressCache[stateAbbr] || []).slice();
    if (chamber === "senate") arr = arr.filter(function (m) { return m.chamber === "senate"; });
    else if (chamber === "house") arr = arr.filter(function (m) { return m.chamber === "house"; });
    var order = { senate: 0, house: 1 };
    arr.sort(function (a, b) { return (order[a.chamber] - order[b.chamber]) || a.name.localeCompare(b.name); });
    return arr;
  }

  // Blackout list applied client-side (mirrors the server scrub).
  function reEsc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
  function stripDashes(t) { return t.replace(/\s*(?:--+|[—–―])\s*/g, ", "); }
  function scrubTerms(text) {
    var list = (state.ref.blacklist || []).slice().sort(function (a, b) { return (b.term || "").length - (a.term || "").length; });
    var hits = [];
    list.forEach(function (e) {
      if (!e.term) return;
      var rx = new RegExp("\\b" + reEsc(e.term) + "\\b", "gi");
      if (rx.test(text)) { hits.push(e.term); text = text.replace(rx, e.replacement || ""); }
    });
    return [text, hits];
  }
  function cleanupText(text) {
    text = text.replace(/,\s*(?=[,.;:!?])/g, "");
    text = text.replace(/([.!?])\s*,\s*/g, "$1 ");
    text = text.replace(/^\s*,\s*/, "");
    text = text.replace(/[ \t]{2,}/g, " ");
    text = text.replace(/ +([,.;:!?])/g, "$1");
    text = text.replace(/[ \t]+\n/g, "\n");
    text = text.replace(/\n{3,}/g, "\n\n");
    text = text.replace(/(^|[.!?]\s+|\n\s*)([a-z])/g, function (m, a, b) { return a + b.toUpperCase(); });
    return text.trim();
  }
  function cleanScript(text) { var r = scrubTerms(stripDashes(text)); return [cleanupText(r[0]), r[1]]; }

  function bannedTermsStr() {
    var terms = (state.ref.blacklist || []).slice().sort(function (a, b) { return (b.term || "").length - (a.term || "").length; })
      .map(function (e) { return e.term; }).filter(Boolean).slice(0, 40);
    return terms.map(function (t) { return '"' + t + '"'; }).join(", ");
  }
  function systemPrompt() {
    return "You write first-person testimony that a real person reads out loud to their elected official about artificial intelligence. It has to sound like THEM, not like a machine wrote it.\n\n" +
      "HARD RULES:\n1. NEVER use an em dash or en dash. No \"--\". Use a comma, a period, or a new sentence.\n" +
      "2. THE BLACKOUT LIST. Never use any of these AI-tell words or phrases: " + bannedTermsStr() + ". Also avoid \"It's not just X, it's Y\", \"on one hand / on the other hand\", and anything that reads like a press release.\n" +
      "3. Write the way people actually talk. Contractions. Short sentences. Say plain things plainly. Concrete detail, not vague uplift.\n\n" +
      "VOICE: First person, address the legislator by name. Grounded in the speaker's own life and community (never invent facts about them). Focused on ONE AI use and ONE goal. Honest, no partisan attacks, no made-up statistics.\n\n" +
      "SHAPE: greet and name yourself; say why it's personal fast; make the case for this one AI use and goal with a concrete example; make one clear ask; close with a line that sticks and a thank you.\n\n" +
      "Return ONLY the spoken words. No headings, no stage directions, no notes.";
  }
  async function clientGenerate() {
    var key = getKey();
    if (!key) { showKeyOnboarding(false); throw new Error("Add your API key first."); }
    var leg = state.legislator, app = state.application, goal = state.goal, u = state.user;
    var minutes = state.minutes, target = Math.max(90, Math.round(minutes * WPM));
    var legLine = leg.name + ", " + leg.role + (leg.district ? ", District " + leg.district : "") + " (" + leg.party + ", " + leg.state + ")";
    var profile = [u.name ? "Name: " + u.name : "", u.gender ? "Gender: " + u.gender : "", u.age ? "Age: " + u.age : "", u.state ? "Home state: " + u.state : ""].filter(Boolean).join("; ") || "(not specified)";
    var socialLines = [];
    ["youtube", "facebook", "instagram", "linkedin"].forEach(function (k) { if (state.socials[k]) socialLines.push("- " + k + ": " + state.socials[k]); });
    var creator = socialLines.length ? "SPEAKER'S PUBLIC CHANNELS (mention naturally if it helps; do not invent details):\n" + socialLines.join("\n") : "SPEAKER'S PUBLIC PRESENCE: (none provided)";
    var userPrompt = "Write spoken testimony the speaker reads out loud.\n\nWHO THEY ARE TALKING TO:\n" + legLine +
      "\n\nWHO IS SPEAKING:\n" + profile + "\n\n" + creator +
      "\n\nTHE ONE AI USE:\n" + app.name + ": " + app.blurb + "\n\nTHE ONE GOAL:\n" + goal.name + ": " + goal.blurb +
      "\n\nLENGTH: about " + minutes + " minute(s) out loud, roughly " + target + " words. Hit that length closely.\n\n" +
      "Make it personal, specific to " + leg.state + " and to " + leg.name + ", focused only on " + app.name + " and " + goal.name + ". No em dashes. Do not sound like AI. Return ONLY the spoken words.";
    var text = await callModel(systemPrompt(), userPrompt, 4000);
    var cleaned = cleanScript(text.trim());
    var script = cleaned[0], flagged = cleaned[1];
    var wc = script.trim().split(/\s+/).filter(Boolean).length;
    return {

      script: script, word_count: wc, estimated_minutes: Math.round(wc / WPM * 10) / 10,

  async function callClaude(system, userText, maxTokens) {
    var r = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": getKey(),
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({ model: MODEL, max_tokens: maxTokens, system: system, messages: [{ role: "user", content: userText }] }),
    });
    if (r.status === 401) throw new Error("Your API key was rejected (401). Check it under 'API key' on the home screen.");
    if (!r.ok) { var t = await r.text().catch(function () { return ""; }); throw new Error("Claude error (" + r.status + "): " + t.slice(0, 200)); }
    var d = await r.json();
    return (d.content && d.content[0] && d.content[0].text) || "";
  }

  // ── Google AI (Gemini) support: keys starting with "AIza" ──
  function keyProvider(k) { k = k || getKey(); return k.indexOf("AIza") === 0 ? "google" : "anthropic"; }
  var _geminiModel = null;
  async function pickGeminiModel() {
    // Ask Google which models this key can use right now; pick the newest Flash.
    if (_geminiModel) return _geminiModel;
    try {
      var r = await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key=" + encodeURIComponent(getKey()));
      if (r.ok) {
        var d = await r.json();
        var scored = (d.models || [])
          .filter(function (m) { return (m.supportedGenerationMethods || []).indexOf("generateContent") >= 0; })
          .map(function (m) {
            var n = (m.name || "").replace(/^models\//, "");
            var mm = n.match(/^gemini-(\d+(?:\.\d+)?)-(flash|pro)\b/);
            return mm ? { n: n, v: parseFloat(mm[1]), t: mm[2] } : null;
          })
          .filter(Boolean);
        scored.sort(function (a, b) {
          if (b.v !== a.v) return b.v - a.v;                    // newest version first
          if (a.t !== b.t) return a.t === "flash" ? -1 : 1;     // flash before pro (speed)
          return a.n.length - b.n.length;                        // shortest/stable name first
        });
        if (scored.length) { _geminiModel = scored[0].n; return _geminiModel; }
      }
    } catch (e) {}
    _geminiModel = GEMINI_FALLBACKS[0];
    return _geminiModel;
  }
  async function callGemini(system, userText) {
    var first = await pickGeminiModel();
    var models = [first].concat(GEMINI_FALLBACKS.filter(function (m) { return m !== first; }));
    var lastStatus = 0, lastText = "";
    for (var i = 0; i < models.length; i++) {
      var r = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + models[i] + ":generateContent?key=" + encodeURIComponent(getKey()), {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: system }] },
          contents: [{ role: "user", parts: [{ text: userText }] }],
        }),
      });
      if (r.ok) {
        var d = await r.json();
        var c = d.candidates && d.candidates[0];
        var parts = (c && c.content && c.content.parts) || [];
        return parts.map(function (p) { return p.text || ""; }).join("");
      }
      lastStatus = r.status; lastText = await r.text().catch(function () { return ""; });
      if (r.status !== 404) break;   // only "model not found" falls through to the next model
    }
    if (lastStatus === 400 || lastStatus === 401 || lastStatus === 403)
      throw new Error("Your Google AI key was rejected (" + lastStatus + "). Check it under 'API key' on the home screen.");
    throw new Error("Google AI error (" + lastStatus + "): " + lastText.slice(0, 200));
  }
  async function callModel(system, userText, maxTokens) {
    return keyProvider() === "google" ? callGemini(system, userText) : callClaude(system, userText, maxTokens);
  }

      '<h2>Your script</h2>' +
      '<div class="result-title">' + esc(r.title) + '</div>' +
      '<div class="badges">' +
        '<span class="badge" id="wcBadge"><b>' + wc + '</b> words</span>' +
        '<span class="badge"><b>~' + r.estimated_minutes + '</b> min</span>' +
        (scrubbed.length ? '<span class="badge ok">Blackout: <b>' + scrubbed.length + ' removed</b></span>' : '<span class="badge ok">Blackout: <b>clean</b></span>') +
      '</div>' +
      '<textarea class="script" id="scriptText" spellcheck="true">' + esc(r.script) + '</textarea>' +
      '<div class="edit-hint">You can edit the script here. Changes are saved and used by the teleprompter.</div>' +
      '<div class="row" style="margin-top:14px">' +
        '<button class="btn ghost" id="copyBtn">Copy</button>' +
        '<button class="btn ghost" id="dlBtn">Save / Share</button>' +
      '</div>' +
      '<button class="btn" id="teleBtn" style="margin-top:10px">Open teleprompter</button>';
    var ta = document.getElementById("scriptText");
    function persistEdit() {
      r.script = ta.value;
      var n = ta.value.trim().split(/\s+/).filter(Boolean).length;
      var wb = document.getElementById("wcBadge"); if (wb) wb.innerHTML = "<b>" + n + "</b> words";
      updateHistory(r.id, ta.value);
    }
    ta.addEventListener("input", persistEdit);
    document.getElementById("copyBtn").addEventListener("click", function () {
      navigator.clipboard.writeText(curScript()).then(function () { flash("copyBtn", "Copied!"); });
    });
    document.getElementById("dlBtn").addEventListener("click", function () { shareOrDownload(r.title, curScript()); });
    document.getElementById("teleBtn").addEventListener("click", function () { openTeleprompter(r.title, curScript()); });
    nav(state.fromHistory
      ? [ { label: "Back", cls: "ghost", flex0: true, onClick: showHistory }, { label: "New script", onClick: function () { reset(); } } ]
      : [ { label: "Start over", cls: "ghost", flex0: true, onClick: function () { reset(); } }, { label: "Rewrite", onClick: generate } ]);
  }
  function flash(id, txt) { var b = document.getElementById(id); if (!b) return; var o = b.textContent; b.textContent = txt; setTimeout(function () { b.textContent = o; }, 1200); }

  // ── On-device saved scripts (localStorage, no account needed) ──
  var HKEY = "testifai_scripts";
  function loadHistory() { try { return JSON.parse(localStorage.getItem(HKEY) || "[]"); } catch (e) { return []; } }
  function writeHistory(arr) { try { localStorage.setItem(HKEY, JSON.stringify(arr.slice(0, 50))); } catch (e) {} }
  function saveToHistory(r) {
    var arr = loadHistory();
    var id = "s" + Date.now() + Math.floor(Math.random() * 1000);
    arr.unshift({ id: id, title: r.title, script: r.script, word_count: r.word_count,
      estimated_minutes: r.estimated_minutes, blackout_scrubbed: r.blackout_scrubbed || [], ts: Date.now() });
    writeHistory(arr); return id;
  }
  function updateHistory(id, script) {
    if (!id) return; var arr = loadHistory(); var hit = arr.filter(function (x) { return x.id === id; })[0];
    if (hit) { hit.script = script; hit.word_count = script.trim().split(/\s+/).filter(Boolean).length; writeHistory(arr); }
  }
  function deleteHistory(id) { writeHistory(loadHistory().filter(function (x) { return x.id !== id; })); }
  function fmtDate(ts) { try { return new Date(ts).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }); } catch (e) { return ""; } }

  function showHistory() {
    stepsEl.classList.add("hidden");
    document.getElementById("tagline").classList.add("hidden");
    var arr = loadHistory();
    var body = '<h2>My scripts</h2>';
    if (!arr.length) {
      body += '<p class="sub">Scripts you generate are saved here on this device.</p><div class="msg info">No saved scripts yet.</div>';
    } else {
      body += '<p class="sub">' + arr.length + ' saved on this device.</p><div class="hist" id="histList"></div>';
    }
    screen.innerHTML = body;
    if (arr.length) {
      var list = document.getElementById("histList");
      arr.forEach(function (rec) {
        var row = el('<div class="row2"><div class="meta"><div class="name">' + esc(rec.title) + '</div>' +
          '<div class="desc">' + fmtDate(rec.ts) + ' &middot; ' + rec.word_count + ' words</div></div>' +
          '<div class="del" title="Delete">&times;</div></div>');
        row.querySelector(".meta").addEventListener("click", function () { state.result = rec; state.fromHistory = true; go(6); });
        row.querySelector(".del").addEventListener("click", function () { deleteHistory(rec.id); showHistory(); });
        list.appendChild(row);
      });
    }
    window.scrollTo(0, 0);
    nav([{ label: "Back", cls: "ghost", flex0: true, onClick: function () { go(0); } }, { label: "New script", onClick: function () { reset(); } }]);
  }

  // ── Save / share (iOS uses the native share sheet; a.download is ignored there) ──
  function slug(t) { return (String(t || "testifai-script").replace(/[^a-z0-9]+/gi, "-").toLowerCase().replace(/^-+|-+$/g, "")) || "testifai-script"; }
  async function shareOrDownload(title, text) {
    var body = title + "\n\n" + text + "\n";
    var fname = slug(title) + ".txt";
    try {
      if (navigator.canShare) {
        var file = new File([body], fname, { type: "text/plain" });
        if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: title }); return; }
      }
    } catch (e) {}
    try { if (navigator.share) { await navigator.share({ title: title, text: body }); return; } } catch (e) {}
    try {
      var blob = new Blob([body], { type: "text/plain" });
      var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = fname;
      document.body.appendChild(a); a.click(); a.remove(); return;
    } catch (e) {}
    try { await navigator.clipboard.writeText(body); alert("Copied to clipboard."); } catch (e) {}
  }

  // ── In-app teleprompter (never leaves the app, so the iPhone PWA stays standalone) ──
  var TP = { scrolling: false, raf: null, speed: 55, reading: false, sentences: [], voices: [], keepAlive: null };
  var tpEl, tpScroll, tpInner;

  function splitSentences(para) { return (para.match(/[^.!?]+[.!?]*/g) || [para]).filter(function (s) { return s.trim().length; }); }

  function openTeleprompter(title, script) {
    tpInner.innerHTML = ""; TP.sentences = [];
    if (title) { var t = document.createElement("div"); t.className = "tp-title"; t.textContent = title; tpInner.appendChild(t); }
    script.split(/\n{2,}/).forEach(function (para) {
      var pdiv = document.createElement("div"); pdiv.style.marginBottom = "0.85em";
      splitSentences(para.replace(/\n+/g, " ")).forEach(function (s) {
        var span = document.createElement("span"); span.className = "sent"; span.textContent = s.trim() + " ";
        pdiv.appendChild(span); TP.sentences.push(span);
      });
      tpInner.appendChild(pdiv);
    });
    tpEl.style.setProperty("--tp-size", document.getElementById("tpSize").value + "px");
    tpScroll.scrollTop = 0;
    tpEl.classList.remove("hidden");
    document.body.style.overflow = "hidden";
    loadVoices();
  }
  function closeTeleprompter() { setTpScroll(false); stopRead(); tpEl.classList.add("hidden"); document.body.style.overflow = ""; }

  function setTpScroll(on) {
    TP.scrolling = on; var b = document.getElementById("tpPlay");
    b.classList.toggle("on", on); b.textContent = on ? "⏸ Pause" : "▶ Scroll";
    if (on) { cancelAnimationFrame(TP.raf); TP.raf = requestAnimationFrame(tpTick); }
  }
  function tpTick() {
    if (!TP.scrolling) return;
    tpScroll.scrollTop += TP.speed / 60;
    if (tpScroll.scrollTop + tpScroll.clientHeight >= tpScroll.scrollHeight - 1) { setTpScroll(false); return; }
    TP.raf = requestAnimationFrame(tpTick);
  }

  function hasSpeech() { return "speechSynthesis" in window && "SpeechSynthesisUtterance" in window; }
  function loadVoices() {
    var grp = document.getElementById("tpVoiceGrp");
    if (!hasSpeech()) { grp.style.display = "none"; document.getElementById("tpRead").style.display = "none"; return; }
    var all = window.speechSynthesis.getVoices();
    TP.voices = all.filter(function (v) { return /^en/i.test(v.lang); });
    if (!TP.voices.length) TP.voices = all;
    var sel = document.getElementById("tpVoice"); sel.innerHTML = "";
    TP.voices.forEach(function (v, i) { var o = document.createElement("option"); o.value = i; o.textContent = v.name; if (v.default) o.selected = true; sel.appendChild(o); });
    grp.style.display = TP.voices.length ? "" : "none";
  }
  function highlight(i) { TP.sentences.forEach(function (s, j) { s.classList.toggle("active", j === i); }); }
  function nearestSentence() {
    var mid = tpScroll.scrollTop + tpScroll.clientHeight / 2, best = 0, bd = 1e12;
    TP.sentences.forEach(function (s, i) { var c = s.offsetTop + s.offsetHeight / 2; var d = Math.abs(c - mid); if (d < bd) { bd = d; best = i; } });
    return best;
  }
  function speakFrom(i) {
    if (i >= TP.sentences.length) { stopRead(); return; }
    highlight(i);
    TP.sentences[i].scrollIntoView({ behavior: "smooth", block: "center" });
    var u = new SpeechSynthesisUtterance(TP.sentences[i].textContent.trim());
    var sel = document.getElementById("tpVoice"); var v = TP.voices[+sel.value]; if (v) u.voice = v;
    u.rate = parseFloat(document.getElementById("tpRate").value) || 1;
    u.onend = function () { if (TP.reading) speakFrom(i + 1); };
    u.onerror = function () { if (TP.reading) speakFrom(i + 1); };
    window.speechSynthesis.speak(u);
  }
  function startRead() {
    if (!hasSpeech()) { alert("Read aloud isn't supported in this browser."); return; }
    window.speechSynthesis.cancel();
    TP.reading = true; setReadBtn(true);
    // iOS silently pauses long synth queues; nudge it back awake.
    clearInterval(TP.keepAlive);
    TP.keepAlive = setInterval(function () { var s = window.speechSynthesis; if (TP.reading && s.paused) s.resume(); }, 2500);
    speakFrom(nearestSentence());
  }
  function stopRead() {
    TP.reading = false; setReadBtn(false); clearInterval(TP.keepAlive);
    if (hasSpeech()) window.speechSynthesis.cancel();
    highlight(-1);
  }
  function setReadBtn(on) { var b = document.getElementById("tpRead"); b.classList.toggle("on", on); b.textContent = on ? "⏹ Stop" : "🔊 Read"; }

  function initTeleprompter() {
    tpEl = document.getElementById("tp"); tpScroll = document.getElementById("tpScroll"); tpInner = document.getElementById("tpInner");
    document.getElementById("tpPlay").onclick = function () { setTpScroll(!TP.scrolling); };
    document.getElementById("tpRead").onclick = function () { TP.reading ? stopRead() : startRead(); };
    document.getElementById("tpSpeed").oninput = function (e) { TP.speed = +e.target.value; };
    document.getElementById("tpSize").oninput = function (e) { tpEl.style.setProperty("--tp-size", e.target.value + "px"); };
    document.getElementById("tpRate").oninput = function () { if (TP.reading) startRead(); };
    document.getElementById("tpVoice").onchange = function () { if (TP.reading) startRead(); };
    document.getElementById("tpClose").onclick = closeTeleprompter;
    Array.prototype.forEach.call(document.querySelectorAll("#tpBar .sw"), function (sw) {
      sw.onclick = function () {
        if (sw.dataset.bg) tpEl.style.setProperty("--tp-bg", sw.dataset.bg);
        if (sw.dataset.fg) tpEl.style.setProperty("--tp-fg", sw.dataset.fg);
      };
    });
    tpScroll.addEventListener("click", function () { document.getElementById("tpBar").classList.toggle("hidden"); });
    if (hasSpeech()) window.speechSynthesis.onvoiceschanged = loadVoices;
  }

  // ── iOS "Add to Home Screen" hint (only on iOS Safari, not already installed) ──
  function maybeShowA2HS() {
    var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    var standalone = navigator.standalone === true || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
    var dismissed = false; try { dismissed = !!localStorage.getItem("a2hs_dismissed"); } catch (e) {}
    if (!isIOS || standalone || dismissed) return;
    var d = document.createElement("div"); d.className = "a2hs";
    d.innerHTML = '<div>Install the app: tap <b>Share</b>, then <b>Add to Home Screen</b>.</div><div class="x">&times;</div>';
    d.querySelector(".x").onclick = function () { d.remove(); try { localStorage.setItem("a2hs_dismissed", "1"); } catch (e) {} };
    document.body.appendChild(d);
  }

  function go(step) { state.step = step; render(); }
  function reset() {
    state.step = 1; state.legislator = null; state.application = null; state.goal = null;
    state.result = null; state.fromHistory = false; state.minutes = 2; state.targetState = ""; state.legislators = []; state.appSearch = "";
    render();
  }

  boot();
})();
</script>
</body>
</html>
